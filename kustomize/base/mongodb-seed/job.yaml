apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-seed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mongodb-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-mongodb
          image: mongodb
          command:
            - mongosh
            - --host
            - mongodb
            - --eval
            - "db.adminCommand('ping')"
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
      containers:
        - name: seed
          image: mongodb
          command:
            - mongosh
            - --host
            - mongodb
            - /scripts/init-mongodb.js
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: seed-scripts
              mountPath: /scripts
      volumes:
        - name: seed-scripts
          configMap:
            name: mongodb-seed-scripts
